name: Azure CI/CD Pipeline

on:
    push:
        branches:
            - "**" # Trigger on push to any branch

permissions:
    id-token: write # Required for requesting the JWT
    contents: read # Required for actions/checkout

env:
    ARM_CLIENT_ID: ${{ secrets.SANDBOX_AZURE_CLIENT_ID }}
    ARM_SUBSCRIPTION_ID: ${{ secrets.SANDBOX_AZURE_SUBSCRIPTION_ID }}
    ARM_TENANT_ID: ${{ secrets.SANDBOX_AZURE_TENANT_ID }}
    ARM_USE_OIDC: true

jobs:
    plan:
        name: "Plan Changes"
        runs-on: ubuntu-latest
        environment: sandbox
        defaults:
            run:
                working-directory: ./environments/sandbox/ai-devops-terraform

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.SANDBOX_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.SANDBOX_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.SANDBOX_AZURE_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init

            - name: Terraform Plan
              run: |
                  terraform plan -out=tfplan

    apply:
        name: "Apply Changes"
        needs: [ plan ] # Only run if the plan job succeeds
        runs-on: ubuntu-latest
        environment: sandbox
        defaults:
            run:
                working-directory: ./environments/sandbox/ai-devops-terraform

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.SANDBOX_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.SANDBOX_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.SANDBOX_AZURE_SUBSCRIPTION_ID }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init

            - name: Terraform Apply
              run: |
                  terraform apply -auto-approve
