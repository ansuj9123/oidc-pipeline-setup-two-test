name: main-pipeline

on:
    push:
        branches: [ "**" ]
        paths:
            - "environments/**"
            - ".github/workflows/**"
    pull_request:
        branches: [ "**" ]
        paths:
            - "environments/**"
            - ".github/workflows/**"

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-main
    cancel-in-progress: false

env:
    ARM_USE_OIDC: true
    TF_VERSION: 1.9.0
    ARM_USE_AZUREAD: true
    TF_IN_AUTOMATION: true

jobs:
    plan:
        runs-on: ubuntu-latest
        environment: main
        defaults:
            run:
                working-directory: environments/main
        env:
            ARM_CLIENT_ID: ${{ secrets.SANDPIT_AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.SANDPIT_AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.SANDPIT_AZURE_SUBSCRIPTION_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Verify Secret Availability
              shell: bash
              run: |
                  if [ -z "${{ secrets.SANDPIT_AZURE_CLIENT_ID }}" ]; then
                    echo "ERROR: SANDPIT_AZURE_CLIENT_ID is empty. Check Environment secrets."
                    exit 1
                  fi
                  if [ -z "${{ secrets.SANDPIT_AZURE_TENANT_ID }}" ]; then
                    echo "ERROR: SANDPIT_AZURE_TENANT_ID is empty. Check Environment secrets."
                    exit 1
                  fi

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.SANDPIT_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.SANDPIT_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.SANDPIT_AZURE_SUBSCRIPTION_ID }}

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Upload plan artifact
              uses: actions/upload-artifact@v4
              with:
                  name: tfplan-main
                  path: environments/main/tfplan

    apply:
        needs: plan
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: main
        defaults:
            run:
                working-directory: environments/main
        env:
            ARM_CLIENT_ID: ${{ secrets.SANDPIT_AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.SANDPIT_AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.SANDPIT_AZURE_SUBSCRIPTION_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.SANDPIT_AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.SANDPIT_AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.SANDPIT_AZURE_SUBSCRIPTION_ID }}

            - name: Download plan artifact
              uses: actions/download-artifact@v4
              with:
                  name: tfplan-main
                  path: environments/main

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false tfplan
