name: sandbox-pipeline

on:
    push:
        branches: [ "*" ]
    pull_request:
        branches: [ "*" ]

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-sandbox
    cancel-in-progress: false

env:
    ARM_USE_OIDC: true
    TF_VERSION: 1.12.2
    ARM_USE_AZUREAD: true
    TF_IN_AUTOMATION: true

jobs:
    plan:
        runs-on: ubuntu-latest
        environment: sandbox
        defaults:
            run:
                working-directory: environments/sandbox
        env:
            ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check for Terraform Files
              run: |
                  echo "Checking directory: $(pwd)"
                  if [ -z "$(ls -A *.tf 2>/dev/null)" ]; then
                    echo "ERROR: No .tf files found in $(pwd)!"
                    echo "Ensure you have moved your Terraform configuration to this directory."
                    ls -la
                    exit 1
                  fi
                  if [ ! -f "backend.hcl" ]; then
                    echo "ERROR: backend.hcl not found in $(pwd)!"
                    exit 1
                  fi

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Verify Secret Availability
              shell: bash
              run: |
                  if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
                    echo "ERROR: AZURE_CLIENT_ID is empty. Check Environment secrets."
                    exit 1
                  fi
                  if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
                    echo "ERROR: AZURE_TENANT_ID is empty. Check Environment secrets."
                    exit 1
                  fi
                  if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
                    echo "ERROR: AZURE_SUBSCRIPTION_ID is empty. Check Environment secrets."
                    exit 1
                  fi
                  # Diagnostics (Safe because secrets are masked)
                  echo "Client ID Length: ${#CLIENT_ID}"
                  echo "Tenant ID Length: ${#TENANT_ID}"
                  echo "Subscription ID Length: ${#SUBSCRIPTION_ID}"
              env:
                  CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Show Azure Account Info
              run: az account show --output table

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan

            - name: Upload plan artifact
              uses: actions/upload-artifact@v4
              with:
                  name: tfplan-sandbox
                  path: environments/sandbox/tfplan

    apply:
        needs: plan
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: sandbox
        defaults:
            run:
                working-directory: environments/sandbox
        env:
            ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: List files for debugging
              run: |
                  echo "Current directory: $(pwd)"
                  ls -R

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Azure Login
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Download plan artifact
              uses: actions/download-artifact@v4
              with:
                  name: tfplan-sandbox
                  path: environments/sandbox

            - name: Terraform Init
              run: terraform init -backend-config=backend.hcl -input=false

            - name: Terraform Apply
              run: terraform apply -auto-approve -input=false tfplan
